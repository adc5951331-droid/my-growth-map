<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的六堂課成長地圖</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #1A365D;
      --accent: #C5A880;
      --bg: #F7FAFC;
      --card-bg: #FFFFFF;
      --text: #2D3748;
      --gray: #A0AEC0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 480px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 1.4rem; margin: 0; color: var(--primary); }
    p.sub { font-size: 0.85rem; color: var(--gray); margin-top: 4px; }

    /* 時間軸地圖 */
    .timeline { position: relative; margin: 20px 0; padding: 0 10px; }
    .node-card {
      background: var(--card-bg); border-radius: 12px; padding: 16px;
      margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-left: 5px solid var(--accent); position: relative;
    }
    .node-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
    .node-num { color: var(--accent); font-size: 0.85rem; }
    .photo-box {
      width: 100%; height: 160px; background: #EDF2F7; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; margin: 8px 0; position: relative; cursor: pointer;
    }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .photo-box span { color: var(--gray); font-size: 0.9rem; }
    .quote-input {
      width: 100%; border: 1px solid #E2E8F0; border-radius: 6px;
      padding: 8px; font-size: 0.85rem; outline: none; margin-top: 6px;
    }

    /* 成果卡區域 */
    #export-card {
      background: var(--primary); color: white; padding: 24px;
      border-radius: 16px; margin-top: 30px; display: none;
    }
    #export-card h2 { text-align: center; font-size: 1.2rem; margin-top: 0; letter-spacing: 2px; }
    .card-journey { display: flex; justify-content: space-between; margin: 20px 0; }
    .mini-node { text-align: center; font-size: 0.75rem; }
    .mini-thumb { width: 50px; height: 50px; border-radius: 6px; background: #fff; object-fit: cover; margin-top: 4px; }
    
    .btn {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold;
      cursor: pointer; margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>我的六堂課</h1>
    <p class="sub">── 個人成長地圖 ──</p>
  </header>

  <div class="timeline" id="nodes-container">
    </div>

  <button class="btn" onclick="generateJourneyCard()">✨ 第6堂：生成我的成長卡</button>

  <div id="export-card">
    <div style="text-align:center; font-size: 0.75rem; opacity: 0.8;">THU LEARNING JOURNEY</div>
    <h2>我的成長軌跡</h2>
    <div class="card-journey" id="card-thumbnails"></div>
    <div style="margin-top: 16px; font-size: 0.85rem; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px;">
      <div><strong>起點心聲：</strong><span id="start-quote">「尚未填寫」</span></div>
      <div style="margin-top: 6px;"><strong>現在的我：</strong><span id="end-quote">持續探索與前進</span></div>
    </div>
  </div>

  <button id="download-btn" class="btn" style="display:none; background:#2B6CB0;" onclick="downloadImage()">儲存為成長卡圖片</button>
</div>

<script>
  const lessons = [
    { id: 1, title: "看見", sub: "職涯期待" },
    { id: 2, title: "認識", sub: "自我探索" },
    { id: 3, title: "表達", sub: "我的Pitch" },
    { id: 4, title: "呈現", sub: "我的名片" },
    { id: 5, title: "探索", sub: "我的未來" },
    { id: 6, title: "回顧", sub: "我的成長" }
  ];

  const store = JSON.parse(localStorage.getItem('my_journey') || '{}');

  // 渲染節點
  const container = document.getElementById('nodes-container');
  lessons.forEach(l => {
    const card = document.createElement('div');
    card.className = 'node-card';
    const data = store[l.id] || { img: '', quote: '' };
    
    card.innerHTML = `
      <div class="node-header">
        <span>${l.title} ｜ ${l.sub}</span>
        <span class="node-num">0${l.id}</span>
      </div>
      <div class="photo-box" onclick="triggerUpload(${l.id})">
        ${data.img ? `<img src="${data.img}" id="img-${l.id}">` : `<span id="placeholder-${l.id}">📷 點擊新增照片</span>`}
        <input type="file" id="file-${l.id}" accept="image/*" style="display:none" onchange="handleImage(event, ${l.id})">
      </div>
      <input type="text" class="quote-input" placeholder="留下一句話（當時的想法...）" 
        value="${data.quote}" onchange="saveQuote(${l.id}, this.value)">
    `;
    container.appendChild(card);
  });

  function triggerUpload(id) { document.getElementById(`file-${id}`).click(); }

  function handleImage(e, id) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      const base64 = evt.target.result;
      store[id] = store[id] || {};
      store[id].img = base64;
      localStorage.setItem('my_journey', JSON.stringify(store));
      
      const box = document.getElementById(`placeholder-${id}`);
      if(box) box.outerHTML = `<img src="${base64}" id="img-${id}">`;
      else document.getElementById(`img-${id}`).src = base64;
    };
    reader.readAsDataURL(file);
  }

  function saveQuote(id, text) {
    store[id] = store[id] || {};
    store[id].quote = text;
    localStorage.setItem('my_journey', JSON.stringify(store));
  }

  function generateJourneyCard() {
    const thumbContainer = document.getElementById('card-thumbnails');
    thumbContainer.innerHTML = '';
    
    lessons.slice(0, 5).forEach(l => {
      const item = store[l.id];
      const imgUrl = item && item.img ? item.img : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"><rect fill="%23ccc" width="50" height="50"/></svg>';
      thumbContainer.innerHTML += `
        <div class="mini-node">
          <div>${l.title}</div>
          <img class="mini-thumb" src="${imgUrl}">
        </div>
      `;
    });

    if(store[1] && store[1].quote) document.getElementById('start-quote').innerText = `「${store[1].quote}」`;
    if(store[6] && store[6].quote) document.getElementById('end-quote').innerText = `「${store[6].quote}」`;

    const card = document.getElementById('export-card');
    card.style.display = 'block';
    document.getElementById('download-btn').style.display = 'block';
    card.scrollIntoView({ behavior: 'smooth' });
  }

  function downloadImage() {
    html2canvas(document.getElementById('export-card')).then(canvas => {
      const link = document.createElement('a');
      link.download = 'my-growth-journey.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  }
</script>
</body>
</html>
